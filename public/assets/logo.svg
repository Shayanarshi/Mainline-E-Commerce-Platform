<svg width="140" height="40" viewBox="0 0 140 40" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Shopping bag icon -->
  <g>
    <!-- handle -->
    <path d="M13 14 C13 8.5 16.5 5.5 20 5.5 C23.5 5.5 27 8.5 27 14"
          fill="none" stroke="#4F46E5" stroke-width="2.6" stroke-linecap="round"/>
    <!-- bag body -->
    <rect x="7" y="13" width="26" height="21" rx="4.5" fill="#4F46E5"/>
    <!-- subtle checkmark to suggest checkout / complete purchase -->
    <path d="M14.5 23.2 L18.7 27.4 L26 19.5"
          fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="40" y="27.5"
        font-family="Liberation Sans, Arial, Helvetica, sans-serif"
        font-weight="700"
        font-size="18.5"
        letter-spacing="-0.3"
        fill="#1A1A2E">Mainline</text>
</svg>
